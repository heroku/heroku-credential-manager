name: Native Credential Acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        node-version: [20.5.0, 22.x]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Linux Secret Service tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus-x11 gnome-keyring libsecret-tools
      - name: Run native credential acceptance tests (macOS/Windows)
        if: runner.os != 'Linux'
        run: node scripts/native-acceptance.mjs
        env:
          NATIVE_CREDENTIAL_ACCEPTANCE: 'true'
      - name: Run native credential acceptance tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            eval "$(printf %s "heroku-credential-manager-ci" | gnome-keyring-daemon --unlock --components=secrets)"
            NATIVE_CREDENTIAL_ACCEPTANCE=true node scripts/native-acceptance.mjs
          '
