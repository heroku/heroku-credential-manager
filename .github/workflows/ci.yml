name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-package:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: sfdc-hk-ubuntu-latest
            node-version: 22.x
          - os: sfdc-hk-windows-latest
            node-version: 22.x
          - os: sfdc-hk-macos-latest
            node-version: 22.x
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: build
        run: npm run build
      - name: packed tarball fixture
        run: npm run test:package

  # Lint runs once in its own job (eslint output is identical across OS/node),
  # concurrent with the matrix rather than as a gated step inside it.
  lint:
    runs-on: sfdc-hk-ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: lint
        run: npm run lint

  unit:
    needs: build-package
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: sfdc-hk-ubuntu-latest
            node-version: 22.x
          - os: sfdc-hk-windows-latest
            node-version: 22.x
          - os: sfdc-hk-macos-latest
            node-version: 22.x
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: unit tests
        run: npm run test:coverage
